<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>List</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    /* नीचे fixed Total के लिए जगह */
    padding-bottom:80px;
}

   TOP FILTER AREA
========================= */

    padding:6px 10px 4px;

select,

}


.item{

    background:#111;

    margin:6px 10px;

    padding:10px;

    border-radius:8px;

    border:1px solid #222;

    font-size:16px;

}

   HARF

.harf{

    background:#181818;

    border-left:4px solid #fff;

    font-weight:bold;

}

    position:fixed;

</style>

</head>


<body>


<!-- =========================
     FILTERS
========================= -->

<div class="top">


<select id="dateFilter">

    <option value="">
        All Date
    </option>

</select>


<select id="userFilter">

    <option value="">
        All Users
    </option>

</select>


<select id="amountFilter">

    <option value="">
        All Amount
    </option>

</select>


<button onclick="copyData()">

    Copy Data

</button>


</div>


<!-- =========================
     LIST
========================= -->

<div id="list"></div>


<!-- =========================
     TOTAL
========================= -->

<div id="total">

    Total ₹0

</div>



<script>


/* =========================
   SUPABASE
========================= */

const client = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


/* =========================
   MARKET
========================= */

const market =
    localStorage.getItem("market")
    || "faridabad";


/* =========================
   ELEMENTS
========================= */

const dateFilter =
    document.getElementById("dateFilter");

const userFilter =
    document.getElementById("userFilter");

const amountFilter =
    document.getElementById("amountFilter");

const list =
    document.getElementById("list");


/* =========================
   DATA
========================= */

let rawData = [];

let numberData = [];

let harfData = [];

let filteredData = [];


/* =========================
   INDIA DATE
========================= */

function indiaDate(value){

    if(!value){

        return "";

    }


    const d =
        new Date(value);


    const parts =
        new Intl.DateTimeFormat(

            "en-GB",

            {
                timeZone:"Asia/Kolkata",

                year:"numeric",

                month:"2-digit",

                day:"2-digit"
            }

        ).formatToParts(d);


    let day = "";
    let month = "";
    let year = "";


    parts.forEach(p => {

        if(p.type === "day"){

            day = p.value;

        }

        if(p.type === "month"){

            month = p.value;

        }

        if(p.type === "year"){

            year = p.value;

        }

    });


    return `${year}-${month}-${day}`;

}


/* =========================
   DISPLAY DATE
========================= */

function displayDate(date){

    if(!date){

        return "";

    }


    const p =
        date.split("-");


    if(p.length !== 3){

        return date;

    }


    return `${p[2]}-${p[1]}-${p[0]}`;

}


/* =========================
   FORMAT AMOUNT
========================= */

function formatAmount(amount){

    const n =
        Number(amount);


    if(
        Number.isInteger(n)
    ){

        return String(n);

    }


    return n.toFixed(2)
        .replace(/0+$/,"")
        .replace(/\.$/,"");

}


/* =========================
   LOAD FILTERS
========================= */

async function loadFilters(){


    const { data, error } =

        await client

        .from("history")

        .select(
            "created_at,user_id"
        )

        .eq(
            "market",
            market
        );


    if(error){

        console.error(
            "Filter error:",
            error
        );

        return;

    }


    const dates =
        new Set();


    const users =
        new Set();


    (data || []).forEach(row => {


        /* DATE */

        if(row.created_at){

            dates.add(
                indiaDate(
                    row.created_at
                )
            );

        }


        /* USER */

        if(
            row.user_id !== null &&
            row.user_id !== undefined &&
            row.user_id !== ""
        ){

            users.add(
                String(row.user_id)
            );

        }

    });


    /* =========================
       DATE DROPDOWN
    ========================= */

    dateFilter.innerHTML =
        `<option value="">
            All Date
        </option>`;


    [...dates]

        .sort(
            (a,b) =>
            b.localeCompare(a)
        )

        .forEach(date => {

            dateFilter.innerHTML += `

                <option value="${date}">
                    ${displayDate(date)}
                </option>

            `;

        });


    /* =========================
       USER DROPDOWN
    ========================= */

    userFilter.innerHTML =
        `<option value="">
            All Users
        </option>`;


    [...users]

        .sort(
            (a,b) =>
            a.localeCompare(b)
        )

        .forEach(user => {

            userFilter.innerHTML += `

                <option value="${user}">
                    ${user}
                </option>

            `;

        });

}


/* =========================
   LOAD HISTORY
========================= */

async function loadData(){


    list.innerHTML = `

        <div class="empty">
            Loading...
        </div>

    `;


    const {

        data,
        error

    } =

        await client

        .from("history")

        .select("*")

        .eq(
            "market",
            market
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "History error:",
            error
        );


        list.innerHTML = `

            <div class="empty">
                Data load error
            </div>

        `;


        return;

    }


    rawData =
        data || [];


    const selectedDate =
        dateFilter.value;


    const selectedUser =
        userFilter.value;


    /* =========================
       DATE + USER FILTER
    ========================= */

    rawData =
        rawData.filter(row => {


            if(selectedDate){

                const rowDate =
                    indiaDate(
                        row.created_at
                    );


                if(
                    rowDate !==
                    selectedDate
                ){

                    return false;

                }

            }


            if(selectedUser){

                if(

                    String(
                        row.user_id
                    )

                    !==

                    String(
                        selectedUser
                    )

                ){

                    return false;

                }

            }


            return true;

        });


    createList();

}


/* =========================
   CREATE LIST
========================= */

function createList(){


    /* =========================
       NUMBER MAP
    ========================= */

    const numberMap = {};


    for(
        let i = 0;
        i < 100;
        i++
    ){

        const n =
            String(i)
            .padStart(2,"0");


        numberMap[n] = 0;

    }


    /* =========================
       HARF ARRAY
    ========================= */

    const harfs = [];


    /* =========================
       READ EVERY HISTORY ROW
    ========================= */

    rawData.forEach(row => {


        let arr;


        try{

            arr =

                typeof row.data === "string"

                ?

                JSON.parse(row.data)

                :

                row.data;


        }catch(error){

            console.error(
                "JSON error:",
                error
            );

            return;

        }


        if(!Array.isArray(arr)){

            return;

        }


        arr.forEach(item => {


            if(!item){

                return;

            }


            /* =========================
               NUMBER
               OR
               HARF
            ========================= */

            let number =
                item.number ??
                item.num ??
                "";


            let amount =
                Number(

                    item.amount ??
                    item.a ??
                    0

                );


            if(
                number === null ||
                number === undefined
            ){

                return;

            }


            number =
                String(number)
                .trim()
                .toUpperCase();


            /* =========================
               AMOUNT CHECK
            ========================= */

            if(
                !Number.isFinite(amount) ||
                amount <= 0
            ){

                return;

            }


            /* =========================
               HARF
               A7 / B8 / B0
            ========================= */

            if(

                number.startsWith("A") ||
                number.startsWith("B")

            ){

                harfs.push({

                    number:number,

                    amount:amount

                });


                return;

            }


            /* =========================
               NORMAL NUMBER
               00 - 99
            ========================= */

            let n =
                number;


            if(
                /^\d+$/.test(n)
            ){

                n =
                    String(
                        Number(n)
                    )
                    .padStart(2,"0");


                if(
                    numberMap[n] !== undefined
                ){

                    numberMap[n] +=
                        amount;

                }

            }

        });

    });


    /* =========================
       ONLY AMOUNT NUMBERS
    ========================= */

    numberData = [];


    for(
        let i = 0;
        i < 100;
        i++
    ){

        const n =
            String(i)
            .padStart(2,"0");


        if(
            numberMap[n] > 0
        ){

            numberData.push({

                num:n,

                amount:
                    numberMap[n]

            });

        }

    }


    /* =========================
       ONLY AMOUNT HARF
    ========================= */

    harfData =
        harfs;


    /* =========================
       AMOUNT FILTER OPTIONS
    ========================= */

    const amounts =
        new Set();


    numberData.forEach(item => {

        amounts.add(

            Number(
                item.amount
            ).toFixed(2)

        );

    });


    harfData.forEach(item => {

        amounts.add(

            Number(
                item.amount
            ).toFixed(2)

        );

    });


    amountFilter.innerHTML = `

        <option value="">
            All Amount
        </option>

    `;


    [...amounts]

        .sort(
            (a,b) =>
            Number(a) -
            Number(b)
        )

        .forEach(amount => {

            amountFilter.innerHTML += `

                <option value="${amount}">
                    ₹${formatAmount(amount)}
                </option>

            `;

        });


    renderList();

}


/* =========================
   RENDER LIST
========================= */

function renderList(){


    const selectedAmount =
        amountFilter.value;


    let html = "";


    filteredData = [];


    /* =========================
       HARF FIRST
    ========================= */

    harfData.forEach(item => {


        const amount =
            Number(item.amount);


        if(

            selectedAmount &&

            amount.toFixed(2)
            !==
            selectedAmount

        ){

            return;

        }


        html += `

            <div class="item harf">

                ${item.number}
                = ₹${formatAmount(amount)}

            </div>

        `;


        filteredData.push({

            text:
                `${item.number} = ₹${formatAmount(amount)}`,

            amount:amount

        });

    });


    /* =========================
       NORMAL NUMBERS
    ========================= */

    numberData.forEach(item => {


        const amount =
            Number(item.amount);


        if(

            selectedAmount &&

            amount.toFixed(2)
            !==
            selectedAmount

        ){

            return;

        }


        html += `

            <div class="item">

                ${item.num}
                = ₹${formatAmount(amount)}

            </div>

        `;


        filteredData.push({

            text:
                `${item.num} = ₹${formatAmount(amount)}`,

            amount:amount

        });

    });


    /* =========================
       NO DATA
    ========================= */

    if(html === ""){

        html = `

            <div class="empty">

                Is filter mein
                koi data nahi hai

            </div>

        `;

    }


    list.innerHTML =
        html;


    /* =========================
       TOTAL
    ========================= */

    let total = 0;


    rawData.forEach(row => {


        let arr;


        try{

            arr =

                typeof row.data === "string"

                ?

                JSON.parse(row.data)

                :

                row.data;


        }catch(error){

            return;

        }


        if(!Array.isArray(arr)){

            return;

        }


        arr.forEach(item => {


            if(!item){

                return;

            }


            const amount =
                Number(

                    item.amount ??
                    item.a ??
                    0

                );


            if(
                !Number.isFinite(amount) ||
                amount <= 0
            ){

                return;

            }


            if(

                selectedAmount &&

                amount.toFixed(2)
                !==
                selectedAmount

            ){

                return;

            }


            total += amount;

        });

    });


    document.getElementById(
        "total"
    ).innerText =
        "Total ₹" +
        formatAmount(total);

}


/* =========================
   COPY DATA
========================= */

async function copyData(){


    if(
        filteredData.length === 0
    ){

        alert(
            "No data"
        );

        return;

    }


    let text = "";


    filteredData.forEach(item => {

        text +=
            item.text +
            "\n";

    });


    try{

        await navigator
            .clipboard
            .writeText(text);


        alert(
            "Copied ✅"
        );


    }catch(error){

        /* पुराने browser के लिए */

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        alert(
            "Copied ✅"
        );

    }

}


/* =========================
   EVENTS
========================= */

dateFilter.addEventListener(
    "change",
    loadData
);


userFilter.addEventListener(
    "change",
    loadData
);


amountFilter.addEventListener(
    "change",
    renderList
);


/* =========================
   START
========================= */

async function init(){

    await loadFilters();

    await loadData();

}


init();

</script>

</body>
</html>
