<title>List</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

}

</head>

<body>

<div class="top">

<select id="dateFilter">
    <option value="">All Date</option>
</select>

<select id="userFilter">
    <option value="">All Users</option>
</select>

<select id="amountFilter">
    <option value="">All Amount</option>
</select>

<button onclick="copyData()">
    Copy Data
</button>

</div>

<div id="list"></div>

<div id="total">
    Total ₹0
</div>


<script>

const client = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


const market =
    localStorage.getItem("market") || "faridabad";


const dateFilter =
    document.getElementById("dateFilter");

const userFilter =
    document.getElementById("userFilter");

const amountFilter =
    document.getElementById("amountFilter");

const list =
    document.getElementById("list");


let rawData = [];

let numberData = [];

let harfData = [];

let filteredData = [];


/* =========================
   INDIA DATE
========================= */

function indiaDate(value){

    if(!value) return "";

    const d = new Date(value);

    const parts =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                timeZone:"Asia/Kolkata",
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        ).formatToParts(d);

    let day = "";
    let month = "";
    let year = "";

    parts.forEach(p => {

        if(p.type === "day")
            day = p.value;

        if(p.type === "month")
            month = p.value;

        if(p.type === "year")
            year = p.value;

    });

    return `${year}-${month}-${day}`;
}


/* =========================
   DISPLAY DATE
========================= */

function displayDate(date){

    if(!date) return "";

    const p = date.split("-");

    if(p.length !== 3)
        return date;

    return `${p[2]}-${p[1]}-${p[0]}`;
}


/* =========================
   LOAD FILTERS
========================= */

async function loadFilters(){

    const { data, error } =
        await client
        .from("history")
        .select("created_at,user_id")
        .eq("market", market);

    if(error){

        console.error(error);

        return;
    }


    const dates = new Set();

    const users = new Set();


    data.forEach(row => {

        if(row.created_at){

            dates.add(
                indiaDate(row.created_at)
            );

        }

        if(row.user_id){

            users.add(
                row.user_id
            );

        }

    });


    /* DATE */

    dateFilter.innerHTML =
        `<option value="">All Date</option>`;


    [...dates]
        .sort((a,b) => b.localeCompare(a))
        .forEach(date => {

            dateFilter.innerHTML +=
            `<option value="${date}">
                ${displayDate(date)}
            </option>`;

        });


    /* USERS */

    userFilter.innerHTML =
        `<option value="">All Users</option>`;


    [...users]
        .sort()
        .forEach(user => {

            userFilter.innerHTML +=
            `<option value="${user}">
                ${user}
            </option>`;

        });

}


/* =========================
   LOAD DATA
========================= */

async function loadData(){

    list.innerHTML =
        `<div class="empty">Loading...</div>`;


    const { data, error } =
        await client
        .from("history")
        .select("*")
        .eq("market", market)
        .order("created_at", {
            ascending:false
        });


    if(error){

        console.error(error);

        list.innerHTML =
            `<div class="empty">
                Data load error
            </div>`;

        return;
    }


    rawData = data || [];


    const selectedDate =
        dateFilter.value;

    const selectedUser =
        userFilter.value;


    /* DATE + USER FILTER */

    rawData = rawData.filter(row => {

        if(selectedDate){

            if(
                indiaDate(row.created_at)
                !== selectedDate
            ){

                return false;
            }

        }


        if(selectedUser){

            if(
                String(row.user_id)
                !== String(selectedUser)
            ){

                return false;
            }

        }


        return true;

    });


    createList();

}


/* =========================
   CREATE LIST
========================= */

function createList(){

    const numberMap = {};

    const harfs = [];

    const actualRecords = [];


    /* 00-99 map */

    for(let i=0;i<100;i++){

        const n =
            i.toString().padStart(2,"0");

        numberMap[n] = 0;

    }


    rawData.forEach(row => {

        let arr;

        try{

            arr =
                typeof row.data === "string"
                ? JSON.parse(row.data)
                : row.data;

        }catch(e){

            return;

        }


        if(!Array.isArray(arr))
            return;


        arr.forEach(item => {


            /* =========================
               HARF A / B
            ========================= */

            if(
                item.type === "A" ||
                item.type === "B"
            ){

                const number =
                    item.number ??
                    item.num ??
                    "";


                const amount =
                    Number(
                        item.amount ??
                        item.a ??
                        0
                    );


                /* सिर्फ amount वाले Harf */

                if(amount > 0){

                    harfs.push({

                        type:item.type,

                        number:String(number),

                        amount:amount

                    });


                    actualRecords.push({

                        type:"harf",

                        amount:amount

                    });


                    /* Harf का number distribution */

                    const d =
                        String(number);


                    const share =
                        amount / 10;


                    if(item.type === "A"){

                        for(let j=0;j<10;j++){

                            const n =
                                String(
                                    Number(d) + j
                                ).padStart(2,"0");


                            if(numberMap[n] !== undefined){

                                numberMap[n] += share;

                            }

                        }

                    }


                    if(item.type === "B"){

                        for(let j=0;j<10;j++){

                            const n =
                                String(j) + d;


                            n =
                                n.slice(-2);


                            if(numberMap[n] !== undefined){

                                numberMap[n] += share;

                            }

                        }

                    }

                }

                return;

            }


            /* =========================
               DIRECT NUMBER
            ========================= */

            const number =
                item.number ??
                item.num;


            const amount =
                Number(
                    item.amount ??
                    item.a ??
                    0
                );


            if(
                number !== undefined &&
                amount > 0
            ){

                let n =
                    String(number)
                    .padStart(2,"0");


                if(numberMap[n] !== undefined){

                    numberMap[n] += amount;

                }


                actualRecords.push({

                    type:"number",

                    amount:amount

                });

            }

        });

    });


    /* =========================
       NUMBER LIST
       सिर्फ amount वाले
    ========================= */

    numberData = [];


    for(let i=0;i<100;i++){

        const n =
            i.toString().padStart(2,"0");


        if(numberMap[n] > 0){

            numberData.push({

                type:"number",

                num:n,

                amount:numberMap[n]

            });

        }

    }


    /* =========================
       HARF LIST
       सिर्फ amount वाले
    ========================= */

    harfData = harfs;


    /* =========================
       AMOUNT FILTER
    ========================= */

    const amounts = new Set();


    numberData.forEach(item => {

        amounts.add(
            Number(item.amount).toFixed(2)
        );

    });


    harfData.forEach(item => {

        amounts.add(
            Number(item.amount).toFixed(2)
        );

    });


    amountFilter.innerHTML =
        `<option value="">All Amount</option>`;


    [...amounts]
        .sort((a,b) => Number(a)-Number(b))
        .forEach(amount => {

            amountFilter.innerHTML +=
            `<option value="${amount}">
                ₹${Number(amount)}
            </option>`;

        });


    renderList();

}


/* =========================
   RENDER
========================= */

function renderList(){

    const selectedAmount =
        amountFilter.value;


    let html = "";

    filteredData = [];


    /* =========================
       HARF
    ========================= */

    harfData.forEach(item => {

        const amount =
            Number(item.amount);


        if(
            selectedAmount &&
            amount.toFixed(2)
            !== selectedAmount
        ){

            return;

        }


        html += `
            <div class="item harf">
                Harf ${item.type}
                ${item.number}
                = ₹${amount}
            </div>
        `;


        filteredData.push({

            text:
                `Harf ${item.type} ${item.number} = ₹${amount}`,

            amount:amount

        });

    });


    /* =========================
       NUMBERS
    ========================= */

    numberData.forEach(item => {

        const amount =
            Number(item.amount);


        if(
            selectedAmount &&
            amount.toFixed(2)
            !== selectedAmount
        ){

            return;

        }


        html += `
            <div class="item">
                ${item.num} = ₹${amount}
            </div>
        `;


        filteredData.push({

            text:
                `${item.num} = ₹${amount}`,

            amount:amount

        });

    });


    if(html === ""){

        html =
            `<div class="empty">
                Is filter mein koi data nahi hai
            </div>`;

    }


    list.innerHTML = html;


    /* =========================
       TOTAL
    ========================= */

    let total = 0;


    rawData.forEach(row => {

        let arr;

        try{

            arr =
                typeof row.data === "string"
                ? JSON.parse(row.data)
                : row.data;

        }catch(e){

            return;

        }


        if(!Array.isArray(arr))
            return;


        arr.forEach(item => {

            let amount =
                Number(
                    item.amount ??
                    item.a ??
                    0
                );


            if(amount <= 0)
                return;


            if(
                selectedAmount &&
                amount.toFixed(2)
                !== selectedAmount
            ){

                return;

            }


            total += amount;

        });

    });


    document.getElementById("total")
        .innerText =
        "Total ₹" + total;

}


/* =========================
   COPY
========================= */

async function copyData(){

    if(filteredData.length === 0){

        alert("No data");

        return;

    }


    let text = "";


    filteredData.forEach(item => {

        text += item.text + "\n";

    });


    try{

        await navigator.clipboard
            .writeText(text);

        alert("Copied ✅");

    }catch(e){

        alert("Copy nahi hua");

    }

}


/* =========================
   FILTER EVENTS
========================= */

dateFilter.addEventListener(
    "change",
    loadData
);


userFilter.addEventListener(
    "change",
    loadData
);


amountFilter.addEventListener(
    "change",
    renderList
);


/* =========================
   START
========================= */

async function init(){

    await loadFilters();

    await loadData();

}


init();

</script>

</body>
</html>
