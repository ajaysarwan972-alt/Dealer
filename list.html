<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;}

.top{padding:10px;text-align:center;}

select,button{
padding:10px;
margin:5px;
width:90%;
}

.item{
background:#111;
margin:8px;
padding:10px;
border-radius:8px;
}

#total{
position:fixed;
bottom:0;
width:100%;
background:red;
padding:10px;
text-align:center;
}
</style>
</head>

<body>

<div class="top">

<select id="dateFilter" onchange="loadData()">
<option value="">All Date</option>
</select>

<select id="userFilter" onchange="loadData()">
<option value="">All Users</option>
</select>

<select id="amountFilter" onchange="applyFilter()">
<option value="">All Amount</option>
</select>

<button onclick="copyData()">Copy Data</button>

</div>

<div id="list"></div>

<div id="total">Total ₹0</div>

<script>

const client = supabase.createClient(
"https://katbdbzoufiblnnsoxkk.supabase.co",
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"
);

const market = localStorage.getItem("market") || "faridabad";

let fullData = [];
let filteredData = []; // 🔥 NEW

// 🔥 LOAD DATE
async function loadDates(){
let {data} = await client.from("history").select("created_at");

let set={};

data.forEach(r=>{
let d=r.created_at?.split("T")[0];
if(d) set[d]=1;
});

for(let d in set){
dateFilter.innerHTML+=`<option value="${d}">${d}</option>`;
}
}
loadDates();

// 🔥 LOAD USERS
async function loadUsers(){
let {data} = await client.from("history").select("user_id");

let set={};

data.forEach(r=>{
if(r.user_id) set[r.user_id]=1;
});

for(let u in set){
userFilter.innerHTML+=`<option value="${u}">${u}</option>`;
}
}
loadUsers();

// 🔥 LOAD DATA
async function loadData(){

let date = dateFilter.value;
let user = userFilter.value;

let query = client.from("history").select("*").eq("market",market);

if(date){
query = query.gte("created_at",date+"T00:00:00").lte("created_at",date+"T23:59:59");
}

if(user){
query = query.eq("user_id", user);
}

let {data}=await query;

let map={}, total=0;

// reset
for(let i=0;i<100;i++){
let n=i.toString().padStart(2,'0');
map[n]=0;
}

data.forEach(r=>{
try{
let arr=JSON.parse(r.data);

arr.forEach(i=>{

if(i.number && i.amount){
map[i.number]+=Number(i.amount);
total+=Number(i.amount);
}

if(i.num && i.a){
map[i.num]+=Number(i.a);
total+=Number(i.a);
}

if(i.type){
let d=i.number;
let amt=Number(i.amount)||0;
let share=amt/10;

if(i.type=="A"){
for(let j=0;j<10;j++){
map[d+j]+=share;
}
}

if(i.type=="B"){
for(let j=0;j<10;j++){
map[j+d]+=share;
}
}

total+=amt;
}

});

}catch(e){}
});

// 🔥 STORE FULL DATA
fullData = [];

for(let i=0;i<100;i++){
let n=i.toString().padStart(2,'0');
if(map[n]>0){
fullData.push({num:n, amt:map[n]});
}
}

// 🔥 AUTO AMOUNT OPTIONS
let amtSet = {};
amountFilter.innerHTML = `<option value="">All Amount</option>`;

fullData.forEach(i=>{
amtSet[i.amt]=1;
});

for(let a in amtSet){
amountFilter.innerHTML+=`<option value="${a}">₹${a}</option>`;
}

// render
applyFilter();

}

// 🔥 APPLY FILTER
function applyFilter(){

let val = amountFilter.value;
let html="";
let total=0;

filteredData = []; // 🔥 reset

fullData.forEach(i=>{

if(val && i.amt != val) return;

html+=`<div class="item">${i.num} = ₹${i.amt}</div>`;
total+=Number(i.amt);

// 🔥 save filtered
filteredData.push(i);

});

list.innerHTML=html;
document.getElementById("total").innerText="Total ₹"+total;

}

// 🔥 COPY (FIXED)
function copyData(){

if(filteredData.length === 0){
alert("No data");
return;
}

let txt="";

filteredData.forEach(i=>{
txt+=`${i.num} = ₹${i.amt}\n`;
});

navigator.clipboard.writeText(txt);
alert("Copied ✅");

}

loadData();

</script>

</body>
</html>
