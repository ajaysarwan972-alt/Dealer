<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center;}

.top{
display:flex;justify-content:space-between;padding:10px;
}

#grid{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:5px;
padding:10px;
}

.box{
border:1px solid #0ff;
padding:5px;
font-size:12px;
}

select{
padding:10px;margin:10px;
}

#total{
position:fixed;bottom:0;width:100%;
background:red;padding:10px;
}
</style>
</head>

<body>

<div class="top">
<div id="dealerId">ID</div>
<div id="wallet">₹0</div>
</div>

<select id="dateFilter" onchange="loadData()">
<option value="">All Date</option>
</select>

<div id="grid"></div>

<div id="total">Total ₹0</div>

<script>

const client = supabase.createClient(
"https://katbdbzoufiblnnsoxkk.supabase.co",
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"
);

// 🔥 test market (direct set for now)
const market = localStorage.getItem("market") || "faridabad";

// grid create
for(let i=0;i<100;i++){
let n=i.toString().padStart(2,'0');
grid.innerHTML+=`<div class="box" id="b${n}">${n}<br>0</div>`;
}

// load dates
async function loadDates(){
let {data} = await client.from("history").select("created_at");

let set={};

data.forEach(r=>{
let d=r.created_at?.split("T")[0];
if(d) set[d]=1;
});

for(let d in set){
dateFilter.innerHTML+=`<option value="${d}">${d}</option>`;
}
}
loadDates();

// load data
async function loadData(){

let date=dateFilter.value;

let query=client.from("history").select("*").eq("market",market);

if(date){
query=query.gte("created_at",date+"T00:00:00").lte("created_at",date+"T23:59:59");
}

let {data}=await query;

let map={},total=0;

// reset
for(let i=0;i<100;i++){
let n=i.toString().padStart(2,'0');
map[n]=0;
}

data.forEach(r=>{
try{
let arr=JSON.parse(r.data);

arr.forEach(i=>{

if(i.number && i.amount){
map[i.number]=(map[i.number]||0)+Number(i.amount);
total+=Number(i.amount);
}

if(i.num && i.a){
map[i.num]=(map[i.num]||0)+Number(i.a);
total+=Number(i.a);
}

if(i.type){
let d=i.number;
let amt=Number(i.amount)||0;
let share=amt/10;

if(i.type=="A"){
for(let j=0;j<10;j++){
map[d+j]=(map[d+j]||0)+share;
}
}

if(i.type=="B"){
for(let j=0;j<10;j++){
map[j+d]=(map[j+d]||0)+share;
}
}

total+=amt;
}

});

}catch(e){}
});

// update UI
for(let i=0;i<100;i++){
let n=i.toString().padStart(2,'0');
document.getElementById("b"+n).innerHTML=n+"<br>"+(map[n]||0);
}

totalBox.innerText="Total ₹"+total;

}

loadData();

</script>

</body>
</html>
